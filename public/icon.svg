<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner glow stroke -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.4" />

  <!-- Dynamic Bar Chart & AI Sparks -->
  <g transform="translate(64, 76)">
    <!-- Bar 1 -->
    <rect x="40" y="220" width="56" height="110" rx="14" fill="#09090b" fill-opacity="0.85" />
    <!-- Bar 2 -->
    <rect x="124" y="150" width="56" height="180" rx="14" fill="#09090b" fill-opacity="0.85" />
    <!-- Bar 3 -->
    <rect x="208" y="90" width="56" height="240" rx="14" fill="#09090b" fill-opacity="0.85" />
    <!-- Bar 4 (Featured) -->
    <rect x="292" y="30" width="56" height="300" rx="14" fill="#09090b" />

    <!-- Bar Highlights (Emerald neon caps) -->
    <rect x="40" y="220" width="56" height="18" rx="8" fill="#a7f3d0" />
    <rect x="124" y="150" width="56" height="18" rx="8" fill="#6ee7b7" />
    <rect x="208" y="90" width="56" height="18" rx="8" fill="#34d399" />
    <rect x="292" y="30" width="56" height="18" rx="8" fill="#ffffff" />

    <!-- Upward Trend Line -->
    <path d="M 68 210 L 152 140 L 236 80 L 320 20" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sparkles on top right of the peak -->
    <circle cx="320" cy="20" r="16" fill="#ffffff" />
    <polygon points="345,10 355,-10 365,10 385,20 365,30 355,50 345,30 325,20" fill="#fef08a" />
  </g>
</svg>
